name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: [self-hosted, Linux, X64, ubuntu-24]
    # The self-hosted runner lives on the owner's VPS. Never run code from fork
    # pull requests on it: forks only get CI after it is pushed to this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_lab_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway password for the disposable service container, not a secret.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/mcp_lab_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  frontend:
    name: frontend
    runs-on: [self-hosted, Linux, X64, ubuntu-24]
    # The self-hosted runner lives on the owner's VPS. Never run code from fork
    # pull requests on it: forks only get CI after it is pushed to this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
