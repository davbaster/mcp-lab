name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: [self-hosted, Linux, X64, ubuntu-24]
    # The self-hosted runner lives on the owner's VPS. Never run code from fork
    # pull requests on it: forks only get CI after it is pushed to this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_lab_test
        ports:
          # No fixed host port: 5432 may be taken on the runner. Docker picks a free one.
          - 5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - name: Check openapi.yaml is up to date
        run: uv run python scripts/export_openapi.py --check
      - run: uv run alembic upgrade head
        env:
          # The `job` context is not available in job-level env, so each step sets it.
          # A throwaway password for the disposable service container, not a secret.
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mcp_lab_test
      - run: uv run alembic check
        env:
          # The `job` context is not available in job-level env, so each step sets it.
          # A throwaway password for the disposable service container, not a secret.
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mcp_lab_test
      - run: uv run pytest
        env:
          # The `job` context is not available in job-level env, so each step sets it.
          # A throwaway password for the disposable service container, not a secret.
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mcp_lab_test

  frontend:
    name: frontend
    runs-on: [self-hosted, Linux, X64, ubuntu-24]
    # The self-hosted runner lives on the owner's VPS. Never run code from fork
    # pull requests on it: forks only get CI after it is pushed to this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
