components:
  schemas:
    AccountResponse:
      additionalProperties: false
      properties:
        username:
          title: Username
          type: string
      required:
      - username
      title: AccountResponse
      type: object
    ChapterProgressSummary:
      additionalProperties: false
      properties:
        best_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Best Score
        id:
          title: Id
          type: string
        last_lesson_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Lesson Id
        status:
          $ref: '#/components/schemas/ChapterStatus'
      required:
      - id
      - status
      - best_score
      - last_lesson_id
      title: ChapterProgressSummary
      type: object
    ChapterStatus:
      enum:
      - locked
      - in_progress
      - passed
      title: ChapterStatus
      type: string
    ChapterSummary:
      additionalProperties: false
      properties:
        free_preview:
          title: Free Preview
          type: boolean
        id:
          title: Id
          type: string
        lessons:
          items:
            $ref: '#/components/schemas/LessonSummary'
          title: Lessons
          type: array
        status:
          anyOf:
          - $ref: '#/components/schemas/ChapterStatus'
          - type: 'null'
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - free_preview
      - lessons
      - status
      title: ChapterSummary
      type: object
    CourseChaptersResponse:
      additionalProperties: false
      properties:
        chapters:
          items:
            $ref: '#/components/schemas/ChapterSummary'
          title: Chapters
          type: array
        course_id:
          title: Course Id
          type: string
      required:
      - course_id
      - chapters
      title: CourseChaptersResponse
      type: object
    CourseProgressResponse:
      additionalProperties: false
      properties:
        chapters:
          items:
            $ref: '#/components/schemas/ChapterProgressSummary'
          title: Chapters
          type: array
        course_complete:
          title: Course Complete
          type: boolean
        course_id:
          title: Course Id
          type: string
      required:
      - course_id
      - course_complete
      - chapters
      title: CourseProgressResponse
      type: object
    CourseSummary:
      additionalProperties: false
      properties:
        chapter_count:
          title: Chapter Count
          type: integer
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - description
      - chapter_count
      title: CourseSummary
      type: object
    CoursesResponse:
      additionalProperties: false
      properties:
        courses:
          items:
            $ref: '#/components/schemas/CourseSummary'
          title: Courses
          type: array
      required:
      - courses
      title: CoursesResponse
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
    LessonSummary:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      title: LessonSummary
      type: object
    LoginRequest:
      properties:
        password:
          maxLength: 128
          minLength: 1
          title: Password
          type: string
        username:
          maxLength: 64
          minLength: 1
          title: Username
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
    RegisterRequest:
      properties:
        password:
          description: 8 to 12 characters, counted after NFKC normalization. Spaces are kept.
          title: Password
          type: string
        username:
          description: '4 to 8 characters: A-Z, a-z, 0-9, and _. Never trimmed.'
          maxLength: 8
          minLength: 4
          pattern: ^[A-Za-z0-9_]{4,8}$
          title: Username
          type: string
      required:
      - username
      - password
      title: RegisterRequest
      type: object
  securitySchemes:
    SessionCookie:
      in: cookie
      name: session
      type: apiKey
info:
  title: mcp-lab API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: Always `no-store`, so a shared cache never serves one learner's response to
                another.
              schema:
                type: string
            Set-Cookie:
              description: 'The new session cookie: `session=<token>; Max-Age=86400; Path=/; HttpOnly;
                Secure; SameSite=Lax`, with no Domain.'
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Sign in
      tags:
      - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Successful Response
          headers:
            Set-Cookie:
              description: 'Clears the cookie: `session=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax`.
                Sent even when the request had no valid session.'
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Sign out
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: Always `no-store`, so a shared cache never serves one learner's response to
                another.
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - SessionCookie: []
      summary: Who is signed in
      tags:
      - auth
  /api/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: Always `no-store`, so a shared cache never serves one learner's response to
                another.
              schema:
                type: string
            Set-Cookie:
              description: 'The new session cookie: `session=<token>; Max-Age=86400; Path=/; HttpOnly;
                Secure; SameSite=Lax`, with no Domain.'
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create an account and sign in
      tags:
      - auth
  /api/courses:
    get:
      operationId: listCourses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesResponse'
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: List the courses
      tags:
      - courses
  /api/courses/{course_id}/chapters:
    get:
      operationId: listChapters
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          title: Course Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseChaptersResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: 'Always `private, no-store`: the response can depend on who is signed in, so
                no shared cache may keep it.'
              schema:
                type: string
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - SessionCookie: []
      - {}
      summary: List the chapters of a course, with their lessons and (when signed in) status
      tags:
      - courses
  /api/courses/{course_id}/progress:
    get:
      operationId: getProgress
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          title: Course Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseProgressResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: 'Always `private, no-store`: the response can depend on who is signed in, so
                no shared cache may keep it.'
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - SessionCookie: []
      summary: The signed-in learner's status and best score in each chapter of a course
      tags:
      - courses
  /api/health:
    get:
      operationId: health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Health
