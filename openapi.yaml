components:
  schemas:
    AccountResponse:
      additionalProperties: false
      properties:
        username:
          title: Username
          type: string
      required:
      - username
      title: AccountResponse
      type: object
    AnswerItem:
      additionalProperties: false
      properties:
        option_id:
          maxLength: 100
          minLength: 1
          title: Option Id
          type: string
        question_id:
          maxLength: 100
          minLength: 1
          title: Question Id
          type: string
      required:
      - question_id
      - option_id
      title: AnswerItem
      type: object
    AttemptRequest:
      additionalProperties: false
      properties:
        answers:
          items:
            $ref: '#/components/schemas/AnswerItem'
          maxItems: 50
          title: Answers
          type: array
      required:
      - answers
      title: AttemptRequest
      type: object
    ChapterCodeResponse:
      additionalProperties: false
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        course_id:
          title: Course Id
          type: string
        steps:
          items:
            $ref: '#/components/schemas/CodeStep'
          title: Steps
          type: array
        zip:
          $ref: '#/components/schemas/CodeZip'
      required:
      - course_id
      - chapter_id
      - zip
      - steps
      title: ChapterCodeResponse
      type: object
    ChapterProgressSummary:
      additionalProperties: false
      properties:
        best_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Best Score
        id:
          title: Id
          type: string
        last_lesson_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Lesson Id
        status:
          $ref: '#/components/schemas/ChapterStatus'
      required:
      - id
      - status
      - best_score
      - last_lesson_id
      title: ChapterProgressSummary
      type: object
    ChapterStatus:
      enum:
      - locked
      - in_progress
      - passed
      title: ChapterStatus
      type: string
    ChapterSummary:
      additionalProperties: false
      properties:
        free_preview:
          title: Free Preview
          type: boolean
        id:
          title: Id
          type: string
        lessons:
          items:
            $ref: '#/components/schemas/LessonSummary'
          title: Lessons
          type: array
        status:
          anyOf:
          - $ref: '#/components/schemas/ChapterStatus'
          - type: 'null'
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - free_preview
      - lessons
      - status
      title: ChapterSummary
      type: object
    CodeFile:
      additionalProperties: false
      properties:
        changed_lines:
          items:
            type: integer
          title: Changed Lines
          type: array
        content:
          title: Content
          type: string
        path:
          title: Path
          type: string
        status:
          $ref: '#/components/schemas/CodeFileStatus'
      required:
      - path
      - status
      - content
      - changed_lines
      title: CodeFile
      type: object
    CodeFileStatus:
      enum:
      - added
      - modified
      - deleted
      - unchanged
      title: CodeFileStatus
      type: string
    CodeStep:
      additionalProperties: false
      properties:
        files:
          items:
            $ref: '#/components/schemas/CodeFile'
          title: Files
          type: array
        step:
          title: Step
          type: integer
      required:
      - step
      - files
      title: CodeStep
      type: object
    CodeZip:
      additionalProperties: false
      properties:
        file_name:
          title: File Name
          type: string
        size:
          title: Size
          type: integer
        url:
          title: Url
          type: string
      required:
      - url
      - file_name
      - size
      title: CodeZip
      type: object
    CourseChaptersResponse:
      additionalProperties: false
      properties:
        chapters:
          items:
            $ref: '#/components/schemas/ChapterSummary'
          title: Chapters
          type: array
        course_id:
          title: Course Id
          type: string
      required:
      - course_id
      - chapters
      title: CourseChaptersResponse
      type: object
    CourseProgressResponse:
      additionalProperties: false
      properties:
        chapters:
          items:
            $ref: '#/components/schemas/ChapterProgressSummary'
          title: Chapters
          type: array
        course_complete:
          title: Course Complete
          type: boolean
        course_id:
          title: Course Id
          type: string
      required:
      - course_id
      - course_complete
      - chapters
      title: CourseProgressResponse
      type: object
    CourseSummary:
      additionalProperties: false
      properties:
        chapter_count:
          title: Chapter Count
          type: integer
        description:
          title: Description
          type: string
        id:
          title: Id
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - description
      - chapter_count
      title: CourseSummary
      type: object
    CoursesResponse:
      additionalProperties: false
      properties:
        courses:
          items:
            $ref: '#/components/schemas/CourseSummary'
          title: Courses
          type: array
      required:
      - courses
      title: CoursesResponse
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
      required:
      - code
      - message
      title: ErrorDetail
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      title: ErrorResponse
      type: object
    FailedAttemptResponse:
      additionalProperties: false
      description: A failed attempt. Nothing here points at a right option.
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        course_id:
          title: Course Id
          type: string
        passed:
          const: false
          title: Passed
          type: boolean
        score:
          maximum: 5.0
          minimum: 0.0
          title: Score
          type: integer
        total:
          title: Total
          type: integer
        wrong:
          items:
            $ref: '#/components/schemas/WrongQuestion'
          title: Wrong
          type: array
      required:
      - course_id
      - chapter_id
      - score
      - total
      - passed
      - wrong
      title: FailedAttemptResponse
      type: object
    FeedbackContext:
      additionalProperties: false
      description: What the browser reports about the page. All of it is stored as sent.
      properties:
        app_version:
          maxLength: 100
          minLength: 1
          title: App Version
          type: string
        chapter_id:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-z0-9-]+$
            type: string
          - type: 'null'
          description: Needs a course_id
          title: Chapter Id
        client_time:
          description: The browser's clock, with a time zone. Stored as sent, never trusted.
          format: date-time
          title: Client Time
          type: string
        console_errors:
          items:
            maxLength: 500
            type: string
          maxItems: 10
          title: Console Errors
          type: array
        course_id:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-z0-9-]+$
            type: string
          - type: 'null'
          description: null outside a course; else a configured course
          title: Course Id
        lesson_id:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-z0-9-]+$
            type: string
          - type: 'null'
          description: Needs a course_id
          title: Lesson Id
        page_path:
          description: 'The path only: starts with one /, no query string, no fragment.'
          maxLength: 2000
          minLength: 1
          title: Page Path
          type: string
        question_id:
          anyOf:
          - maxLength: 100
            minLength: 1
            pattern: ^[a-z0-9-]+$
            type: string
          - type: 'null'
          description: Needs a course_id
          title: Question Id
        user_agent:
          maxLength: 1000
          title: User Agent
          type: string
        viewport:
          $ref: '#/components/schemas/Viewport'
      required:
      - page_path
      - course_id
      - app_version
      - user_agent
      - viewport
      - client_time
      - console_errors
      title: FeedbackContext
      type: object
    FeedbackRequest:
      additionalProperties: false
      properties:
        about_quiz_question:
          default: false
          title: About Quiz Question
          type: boolean
        category:
          enum:
          - bug
          - content_error
          - confusing_explanation
          - suggestion
          title: Category
          type: string
        context:
          $ref: '#/components/schemas/FeedbackContext'
        message:
          description: Trimmed of leading and trailing whitespace first, then 10 to 2000 characters.
          maxLength: 2000
          minLength: 10
          title: Message
          type: string
      required:
      - category
      - message
      - context
      title: FeedbackRequest
      type: object
    HealthResponse:
      properties:
        status:
          const: ok
          title: Status
          type: string
      required:
      - status
      title: HealthResponse
      type: object
    LastLessonRequest:
      additionalProperties: false
      properties:
        lesson_id:
          maxLength: 100
          minLength: 1
          title: Lesson Id
          type: string
      required:
      - lesson_id
      title: LastLessonRequest
      type: object
    LessonResponse:
      additionalProperties: false
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        course_id:
          title: Course Id
          type: string
        lesson_id:
          title: Lesson Id
          type: string
        next_lesson_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Lesson Id
        prev_lesson_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev Lesson Id
        title:
          title: Title
          type: string
        tree:
          additionalProperties: true
          title: Tree
          type: object
      required:
      - course_id
      - chapter_id
      - lesson_id
      - title
      - prev_lesson_id
      - next_lesson_id
      - tree
      title: LessonResponse
      type: object
    LessonSummary:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      title: LessonSummary
      type: object
    LoginRequest:
      properties:
        password:
          maxLength: 128
          minLength: 1
          title: Password
          type: string
        username:
          maxLength: 64
          minLength: 1
          title: Username
          type: string
      required:
      - username
      - password
      title: LoginRequest
      type: object
    PassedAttemptResponse:
      additionalProperties: false
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        course_complete:
          title: Course Complete
          type: boolean
        course_id:
          title: Course Id
          type: string
        next_chapter_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Chapter Id
        passed:
          const: true
          title: Passed
          type: boolean
        results:
          items:
            $ref: '#/components/schemas/QuestionResult'
          title: Results
          type: array
        score:
          maximum: 5.0
          minimum: 0.0
          title: Score
          type: integer
        total:
          title: Total
          type: integer
      required:
      - course_id
      - chapter_id
      - score
      - total
      - passed
      - results
      - next_chapter_id
      - course_complete
      title: PassedAttemptResponse
      type: object
    QuestionResult:
      additionalProperties: false
      properties:
        correct_option_id:
          title: Correct Option Id
          type: string
        explanation:
          title: Explanation
          type: string
        is_correct:
          title: Is Correct
          type: boolean
        lesson_id:
          title: Lesson Id
          type: string
        option_id:
          title: Option Id
          type: string
        question_id:
          title: Question Id
          type: string
      required:
      - question_id
      - option_id
      - correct_option_id
      - is_correct
      - explanation
      - lesson_id
      title: QuestionResult
      type: object
    QuizOption:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        text:
          title: Text
          type: string
      required:
      - id
      - text
      title: QuizOption
      type: object
    QuizQuestion:
      additionalProperties: false
      properties:
        id:
          title: Id
          type: string
        options:
          items:
            $ref: '#/components/schemas/QuizOption'
          title: Options
          type: array
        snippet:
          anyOf:
          - $ref: '#/components/schemas/QuizSnippet'
          - type: 'null'
        text:
          title: Text
          type: string
      required:
      - id
      - text
      - snippet
      - options
      title: QuizQuestion
      type: object
    QuizResponse:
      additionalProperties: false
      properties:
        chapter_id:
          title: Chapter Id
          type: string
        course_id:
          title: Course Id
          type: string
        questions:
          items:
            $ref: '#/components/schemas/QuizQuestion'
          title: Questions
          type: array
      required:
      - course_id
      - chapter_id
      - questions
      title: QuizResponse
      type: object
    QuizSnippet:
      additionalProperties: false
      properties:
        code:
          title: Code
          type: string
        language:
          title: Language
          type: string
      required:
      - language
      - code
      title: QuizSnippet
      type: object
    RegisterRequest:
      properties:
        password:
          description: 8 to 12 characters, counted after NFKC normalization. Spaces are kept.
          title: Password
          type: string
        username:
          description: '4 to 8 characters: A-Z, a-z, 0-9, and _. Never trimmed.'
          maxLength: 8
          minLength: 4
          pattern: ^[A-Za-z0-9_]{4,8}$
          title: Username
          type: string
      required:
      - username
      - password
      title: RegisterRequest
      type: object
    Viewport:
      additionalProperties: false
      properties:
        height:
          maximum: 20000.0
          minimum: 1.0
          title: Height
          type: integer
        width:
          maximum: 20000.0
          minimum: 1.0
          title: Width
          type: integer
      required:
      - width
      - height
      title: Viewport
      type: object
    WrongQuestion:
      additionalProperties: false
      properties:
        lesson_id:
          title: Lesson Id
          type: string
        question_id:
          title: Question Id
          type: string
      required:
      - question_id
      - lesson_id
      title: WrongQuestion
      type: object
  securitySchemes:
    SessionCookie:
      in: cookie
      name: session
      type: apiKey
info:
  title: mcp-lab API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: Always `no-store`, so a shared cache never serves one learner's response to
                another.
              schema:
                type: string
            Set-Cookie:
              description: 'The new session cookie: `session=<token>; Max-Age=86400; Path=/; HttpOnly;
                Secure; SameSite=Lax`, with no Domain.'
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Sign in
      tags:
      - auth
  /api/auth/logout:
    post:
      operationId: logout
      responses:
        '204':
          description: Successful Response
          headers:
            Set-Cookie:
              description: 'Clears the cookie: `session=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Lax`.
                Sent even when the request had no valid session.'
              schema:
                type: string
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Sign out
      tags:
      - auth
  /api/auth/me:
    get:
      operationId: me
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: Always `no-store`, so a shared cache never serves one learner's response to
                another.
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - SessionCookie: []
      summary: Who is signed in
      tags:
      - auth
  /api/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: Always `no-store`, so a shared cache never serves one learner's response to
                another.
              schema:
                type: string
            Set-Cookie:
              description: 'The new session cookie: `session=<token>; Max-Age=86400; Path=/; HttpOnly;
                Secure; SameSite=Lax`, with no Domain.'
              schema:
                type: string
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create an account and sign in
      tags:
      - auth
  /api/courses:
    get:
      operationId: listCourses
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesResponse'
          description: Successful Response
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: List the courses
      tags:
      - courses
  /api/courses/{course_id}/assets/{file_name}:
    get:
      operationId: getAsset
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          title: Course Id
          type: string
      - in: path
        name: file_name
        required: true
        schema:
          title: File Name
          type: string
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                format: binary
                type: string
            image/png:
              schema:
                format: binary
                type: string
            image/svg+xml:
              schema:
                format: binary
                type: string
            image/webp:
              schema:
                format: binary
                type: string
            model/gltf+json:
              schema:
                format: binary
                type: string
            model/gltf-binary:
              schema:
                format: binary
                type: string
            text/vtt:
              schema:
                format: binary
                type: string
          description: The file, exactly as the content build wrote it.
          headers:
            Accept-Ranges:
              description: 'Always `none`: a `Range` header is ignored.'
              schema:
                type: string
            Cache-Control:
              description: 'Always `public, max-age=31536000, immutable`: the opposite of the `private,
                no-store` header of the other routes. The name holds the hash of the bytes, so the file
                under a name never changes and any cache may keep it.'
              schema:
                type: string
            Content-Disposition:
              description: Always `inline`, with no file name.
              schema:
                type: string
            Content-Security-Policy:
              description: 'Sent on an SVG only (not on other types): `script-src ''none''; default-src
                ''none''; style-src ''unsafe-inline''; sandbox`.'
              schema:
                type: string
            ETag:
              description: The SHA-256 of the file in double quotes, the same for every request.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`, on every type.
              schema:
                type: string
        '304':
          description: The `If-None-Match` header names this file's ETag. No body.
          headers:
            Cache-Control:
              description: 'Always `public, max-age=31536000, immutable`: the opposite of the `private,
                no-store` header of the other routes. The name holds the hash of the bytes, so the file
                under a name never changes and any cache may keep it.'
              schema:
                type: string
            Content-Disposition:
              description: Always `inline`, with no file name.
              schema:
                type: string
            Content-Security-Policy:
              description: 'Sent on an SVG only (not on other types): `script-src ''none''; default-src
                ''none''; style-src ''unsafe-inline''; sandbox`.'
              schema:
                type: string
            ETag:
              description: The SHA-256 of the file in double quotes, the same for every request.
              schema:
                type: string
            X-Content-Type-Options:
              description: Always `nosniff`, on every type.
              schema:
                type: string
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: A built asset of a course (image, diagram, 3D model, or caption file), public
      tags:
      - courses
  /api/courses/{course_id}/chapters:
    get:
      operationId: listChapters
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          title: Course Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseChaptersResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: 'Always `private, no-store`: the response can depend on who is signed in, so
                no shared cache may keep it.'
              schema:
                type: string
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      security:
      - SessionCookie: []
      - {}
      summary: List the chapters of a course, with their lessons and (when signed in) status
      tags:
      - courses
  /api/courses/{course_id}/chapters/{chapter_id}/code:
    get:
      operationId: getChapterCode
      parameters:
      - in: path
        name: course_id
        required: true
        schema:
          title: Course Id
          type: string
      - in: path
        name: chapter_id
        required: true
        schema:
          title: Chapter Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterCodeResponse'
          description: Successful Response
          headers:
            Cache-Control:
              description: 'Always `private, no-store`: the response can depend on who is signed in, so
                no shared cache may keep it.'
              schema:
                type: string
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
        '500':
          content:
