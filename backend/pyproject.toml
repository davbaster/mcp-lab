[project]
name = "mcp-lab-backend"
version = "0.1.0"
description = "Backend for mcp-lab"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-core>=0.23.1",
    "openapi-spec-validator>=0.8.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
]
