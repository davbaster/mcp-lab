# Runs as the unprivileged nginx user: port 8080, pid and temp files under /tmp.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # The Content-Security-Policy, generated from content-build/media-config.json when the image is
        # built (scripts/csp.mjs). It is set here, at server level, with `always`, so it is on every
        # response: the app, a client route, and an error page. Keep every add_header out of the
        # location blocks below: one add_header in a location drops all the ones set here.
        include /etc/nginx/csp.conf;

        # Missing build assets are a real 404, never index.html.
        location /assets/ {
            try_files $uri =404;
        }

        # Client-side routes fall back to the app.
        location / {
            try_files $uri /index.html;
        }
    }
}
