<svg id="diagram" width="386" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="statediagram" height="399" viewBox="4 4 386 399" role="img" aria-roledescription="stateDiagram" style="background-color: transparent;" aria-labelledby="diagram-title"><title id="diagram-title">A quiz attempt is open until it is graded, then it is passed or failed</title><style>#diagram{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#1d2330;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram .error-icon{fill:#fdecec;}#diagram .error-text{fill:#c62828;stroke:#c62828;}#diagram .edge-thickness-normal{stroke-width:1px;}#diagram .edge-thickness-thick{stroke-width:3.5px;}#diagram .edge-pattern-solid{stroke-dasharray:0;}#diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram .edge-pattern-dashed{stroke-dasharray:3;}#diagram .edge-pattern-dotted{stroke-dasharray:2;}#diagram .marker{fill:#4a5363;stroke:#4a5363;}#diagram .marker.cross{stroke:#4a5363;}#diagram svg{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;}#diagram p{margin:0;}#diagram defs [id$="-barbEnd"]{fill:#4a5363;stroke:#4a5363;}#diagram g.stateGroup text{fill:#1f5fbf;stroke:none;font-size:10px;}#diagram g.stateGroup text{fill:#1d2330;stroke:none;font-size:10px;}#diagram g.stateGroup .state-title{font-weight:bolder;fill:#1d2330;}#diagram g.stateGroup rect{fill:#eaf1fb;stroke:#1f5fbf;}#diagram g.stateGroup line{stroke:#4a5363;stroke-width:1;}#diagram .transition{stroke:#4a5363;stroke-width:1;fill:none;}#diagram .stateGroup .composit{fill:#ffffff;border-bottom:1px;}#diagram .stateGroup .alt-composit{fill:#e0e0e0;border-bottom:1px;}#diagram .state-note{stroke:#9a6700;fill:#fff6e0;}#diagram .state-note text{fill:#1d2330;stroke:none;font-size:10px;}#diagram .stateLabel .box{stroke:none;stroke-width:0;fill:#eaf1fb;opacity:0.5;}#diagram .edgeLabel .label rect{fill:#eaf1fb;opacity:0.5;}#diagram .edgeLabel{background-color:#ffffff;text-align:center;}#diagram .edgeLabel p{background-color:#ffffff;}#diagram .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram .edgeLabel .label text{fill:#1d2330;}#diagram .label div .edgeLabel{color:#1d2330;}#diagram .stateLabel text{fill:#1d2330;font-size:10px;font-weight:bold;}#diagram .node circle.state-start{fill:#4a5363;stroke:#4a5363;}#diagram .node .fork-join{fill:#4a5363;stroke:#4a5363;}#diagram .node circle.state-end{fill:#1f5fbf;stroke:#ffffff;stroke-width:1.5;}#diagram .end-state-inner{fill:#f6f7f9;stroke-width:1.5;}#diagram .node rect{fill:#eaf1fb;stroke:#1f5fbf;stroke-width:1px;}#diagram .node polygon{fill:#eaf1fb;stroke:#1f5fbf;stroke-width:1px;}#diagram [id$="-barbEnd"]{fill:#4a5363;}#diagram .statediagram-cluster rect{fill:#eaf1fb;stroke:#1f5fbf;stroke-width:1px;}#diagram .cluster-label,#diagram .nodeLabel{color:#1d2330;}#diagram .statediagram-cluster rect.outer{rx:5px;ry:5px;}#diagram .statediagram-state .divider{stroke:#1f5fbf;}#diagram .statediagram-state .title-state{rx:5px;ry:5px;}#diagram .statediagram-cluster.statediagram-cluster .inner{fill:#f6f7f9;}#diagram .statediagram-cluster.statediagram-cluster-alt .inner{fill:#f6f7f9;}#diagram .statediagram-cluster .inner{rx:0;ry:0;}#diagram .statediagram-state rect.basic{rx:5px;ry:5px;}#diagram .statediagram-state rect.divider{stroke-dasharray:10,10;fill:#f6f7f9;}#diagram .note-edge{stroke-dasharray:5;}#diagram .statediagram-note rect{fill:#fff6e0;stroke:#9a6700;stroke-width:1px;rx:0;ry:0;}#diagram .statediagram-note rect{fill:#fff6e0;stroke:#9a6700;stroke-width:1px;rx:0;ry:0;}#diagram .statediagram-note text{fill:#1d2330;}#diagram .statediagram-note .nodeLabel{color:#1d2330;}#diagram .statediagram .edgeLabel{color:red;}#diagram [id$="-dependencyStart"],#diagram [id$="-dependencyEnd"]{fill:#4a5363;stroke:#4a5363;stroke-width:1;}#diagram .statediagramTitleText{text-anchor:middle;font-size:18px;fill:#1d2330;}#diagram [data-look="neo"].statediagram-cluster rect{fill:#eaf1fb;stroke:#1f5fbf;stroke-width:1;}#diagram [data-look="neo"].statediagram-cluster rect.outer{rx:5px;ry:5px;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram .node .neo-node{stroke:#1f5fbf;}#diagram [data-look="neo"].node rect,#diagram [data-look="neo"].cluster rect,#diagram [data-look="neo"].node polygon{stroke:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram [data-look="neo"].node path{stroke:#1f5fbf;stroke-width:1px;}#diagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].node .neo-line path{stroke:#1f5fbf;filter:none;}#diagram [data-look="neo"].node circle{stroke:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].node circle .state-start{fill:#000000;}#diagram [data-look="neo"].icon-shape .icon{fill:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram :root{--mermaid-font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}</style><g><defs><marker id="diagram_stateDiagram-barbEnd" refX="19" refY="7" markerWidth="20" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M 19,7 L9,13 L14,7 L9,1 Z"/></marker></defs><g class="root"><g class="clusters"><g class="statediagram-state statediagram-cluster" id="diagram-state-Graded-2" data-id="Graded" d