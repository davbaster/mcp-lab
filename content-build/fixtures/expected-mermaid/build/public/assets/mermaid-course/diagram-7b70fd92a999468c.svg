<svg id="diagram" width="580.859375" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 580.859375 450" height="450" role="img" aria-roledescription="pie" style="background-color: transparent;" aria-labelledby="diagram-title"><title id="diagram-title">Reading is half of the time and practice is the other half</title><style>#diagram{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#1d2330;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram .error-icon{fill:#fdecec;}#diagram .error-text{fill:#c62828;stroke:#c62828;}#diagram .edge-thickness-normal{stroke-width:1px;}#diagram .edge-thickness-thick{stroke-width:3.5px;}#diagram .edge-pattern-solid{stroke-dasharray:0;}#diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram .edge-pattern-dashed{stroke-dasharray:3;}#diagram .edge-pattern-dotted{stroke-dasharray:2;}#diagram .marker{fill:#4a5363;stroke:#4a5363;}#diagram .marker.cross{stroke:#4a5363;}#diagram svg{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;}#diagram p{margin:0;}#diagram .pieCircle{stroke:#4a5363;stroke-width:2px;opacity:1;}#diagram .pieCircle.highlighted{scale:1.05;opacity:1;}#diagram .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#diagram .pieOuterCircle{stroke:#4a5363;stroke-width:2px;fill:none;}#diagram .pieTitleText{text-anchor:middle;font-size:25px;fill:#1d2330;font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}#diagram .slice{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;fill:#1d2330;font-size:17px;}#diagram .legend text{fill:#1d2330;font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;}#diagram .node .neo-node{stroke:#1f5fbf;}#diagram [data-look="neo"].node rect,#diagram [data-look="neo"].cluster rect,#diagram [data-look="neo"].node polygon{stroke:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].swimlane.cluster rect{filter:none;}#diagram [data-look="neo"].node path{stroke:#1f5fbf;stroke-width:1px;}#diagram [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].node .neo-line path{stroke:#1f5fbf;filter:none;}#diagram [data-look="neo"].node circle{stroke:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].node circle .state-start{fill:#000000;}#diagram [data-look="neo"].icon-shape .icon{fill:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram [data-look="neo"].icon-shape .icon-neo path{stroke:#1f5fbf;filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#diagram :root{--mermaid-font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,1,1,0,185L0,0Z" fill="#eaf1fb" class="pieCircle"/><path d="M0,185A185,185,0,1,1,0,-185L0,0Z" fill="#eaf6ee" class="pieCircle"/><text transform="translate(138.75,3.0808688933348094e-14)" class="slice" style="text-anchor: middle;">50%</text><text transform="translate(-138.75,-1.0624278139522284e-13)" class="slice" style="text-anchor: middle;">50%</text></g><text x="0" y="-200" class="pieTitleText">Time</text><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(234, 241, 251); stroke: rgb(234, 241, 251);"/><text x="22" y="14">Reading</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(234, 246, 238); stroke: rgb(234, 246, 238);"/><text x="22" y="14">Practice</text></g></g></svg>