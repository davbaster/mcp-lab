<svg id="diagram" width="196" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" height="243" viewBox="4 4 196 243" role="img" aria-roledescription="flowchart-v2" style="background-color: transparent;" aria-labelledby="diagram-title"><title id="diagram-title">Three boxes in a row: browser, server, database</title><style>#diagram{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;fill:#1d2330;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#diagram .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#diagram .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#diagram .error-icon{fill:#fdecec;}#diagram .error-text{fill:#c62828;stroke:#c62828;}#diagram .edge-thickness-normal{stroke-width:1px;}#diagram .edge-thickness-thick{stroke-width:3.5px;}#diagram .edge-pattern-solid{stroke-dasharray:0;}#diagram .edge-thickness-invisible{stroke-width:0;fill:none;}#diagram .edge-pattern-dashed{stroke-dasharray:3;}#diagram .edge-pattern-dotted{stroke-dasharray:2;}#diagram .marker{fill:#4a5363;stroke:#4a5363;}#diagram .marker.cross{stroke:#4a5363;}#diagram svg{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;}#diagram p{margin:0;}#diagram .label{font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#1d2330;}#diagram .cluster-label text{fill:#1d2330;}#diagram .cluster-label span{color:#1d2330;}#diagram .cluster-label span p{background-color:transparent;}#diagram .label text,#diagram span{fill:#1d2330;color:#1d2330;}#diagram .node rect,#diagram .node circle,#diagram .node ellipse,#diagram .node polygon,#diagram .node path{fill:#eaf1fb;stroke:#1f5fbf;stroke-width:1px;}#diagram .rough-node .label text,#diagram .node .label text,#diagram .image-shape .label,#diagram .icon-shape .label{text-anchor:middle;}#diagram .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram .rough-node .label,#diagram .node .label,#diagram .image-shape .label,#diagram .icon-shape .label{text-align:center;}#diagram .node.clickable{cursor:pointer;}#diagram .root .anchor path{fill:#4a5363!important;stroke-width:0;stroke:#4a5363;}#diagram .arrowheadPath{fill:#000000;}#diagram .edgePaths .path{stroke:#4a5363;stroke-width:1px;}#diagram .flowchart-link{stroke:#4a5363;fill:none;}#diagram .edgeLabel{background-color:#ffffff;text-align:center;}#diagram .edgeLabel p{background-color:#ffffff;}#diagram .edgeLabel rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram .labelBkg{background-color:rgba(255, 255, 255, 0.5);}#diagram .cluster rect{fill:#f6f7f9;stroke:#8a94a6;stroke-width:1px;}#diagram .cluster text{fill:#1d2330;}#diagram .cluster span{color:#1d2330;}#diagram .node .collapsed-indicator{fill:#8a94a6;stroke:none;opacity:0.6;}#diagram .node .collapsed-separator{stroke:#8a94a6;stroke-width:0.75px;}#diagram div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"Recursive Variable",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:12px;background:#fff6e0;border:1px solid #9a6700;border-radius:2px;pointer-events:none;z-index:100;}#diagram .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#1d2330;}#diagram rect.text{fill:none;stroke-width:0;}#diagram .icon-shape,#diagram .image-shape{background-color:#ffffff;text-align:center;}#diagram .icon-shape p,#diagram .image-shape p{background-color:#ffffff;padding:2px;}#diagram .icon-shape .label rect,#diagram .image-shape .label rect{opacity:0.5;background-color:#ffffff;fill:#ffffff;}#diagram .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#d